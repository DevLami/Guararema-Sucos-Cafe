<?xml version="1.0" encoding="UTF-8"?>
<svg class="cup-svg" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
            <defs>
              <clipPath id="cupClip">
                <path d="M66,120 C60,235 62,340 96,428 Q104,440 116,440 L204,440 Q216,440 224,428 C258,340 260,235 254,120 Z"/>
              </clipPath>
              <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--suco-top)"/>
                <stop offset="100%" stop-color="var(--suco-base)"/>
              </linearGradient>
              <clipPath id="liquidClip">
                <path id="liquidClipPath" d="M0,480 L0,460 L320,460 L320,480 Z"/>
              </clipPath>
            </defs>

            <!-- vidro do copo principal (fundo sutil) -->
            <path d="M66,120 C60,235 62,340 96,428 Q104,440 116,440 L204,440 Q216,440 224,428 C258,340 260,235 254,120 Z" fill="rgba(30,67,53,0.045)"/>

            <!-- liquido -->
            <g clip-path="url(#cupClip)">
              <path id="liquidPath" fill="url(#liquidGrad)" d="M0,480 L0,460 L320,460 L320,480 Z"></path>
            </g>

            <!-- sementes de maracuja -->
            <g clip-path="url(#liquidClip)">
              <g class="seed-float" style="animation-delay:0s"><ellipse cx="104" cy="410" rx="4" ry="2.6" fill="var(--seed)"/></g>
              <g class="seed-float" style="animation-delay:.6s"><ellipse cx="132" cy="424" rx="3.4" ry="2.2" fill="var(--seed)"/></g>
              <g class="seed-float" style="animation-delay:1.1s"><ellipse cx="158" cy="408" rx="4" ry="2.6" fill="var(--seed)"/></g>
              <g class="seed-float" style="animation-delay:.3s"><ellipse cx="182" cy="422" rx="3.6" ry="2.3" fill="var(--seed)"/></g>
              <g class="seed-float" style="animation-delay:1.6s"><ellipse cx="206" cy="406" rx="4" ry="2.6" fill="var(--seed)"/></g>
              <g class="seed-float" style="animation-delay:.9s"><ellipse cx="222" cy="420" rx="3.4" ry="2.2" fill="var(--seed)"/></g>
              <g class="seed-float" style="animation-delay:1.4s"><ellipse cx="118" cy="378" rx="3.6" ry="2.3" fill="var(--seed)" opacity="0.9"/></g>
              <g class="seed-float" style="animation-delay:.2s"><ellipse cx="150" cy="368" rx="3.2" ry="2" fill="var(--seed)" opacity="0.85"/></g>
              <g class="seed-float" style="animation-delay:1.8s"><ellipse cx="190" cy="376" rx="3.6" ry="2.3" fill="var(--seed)" opacity="0.9"/></g>
              <g class="seed-float" style="animation-delay:.7s"><ellipse cx="216" cy="366" rx="3.2" ry="2" fill="var(--seed)" opacity="0.85"/></g>
              <g class="seed-float" style="animation-delay:1.2s"><ellipse cx="134" cy="330" rx="3" ry="1.9" fill="var(--seed)" opacity="0.7"/></g>
              <g class="seed-float" style="animation-delay:.5s"><ellipse cx="176" cy="322" rx="3" ry="1.9" fill="var(--seed)" opacity="0.7"/></g>
              <g class="seed-float" style="animation-delay:1.6s"><ellipse cx="200" cy="332" rx="2.8" ry="1.8" fill="var(--seed)" opacity="0.65"/></g>
            </g>

            <!-- bolhas -->
            <g clip-path="url(#liquidClip)">
              <circle class="bubble" cx="112" cy="0" r="3" style="animation-delay:0s"/>
              <circle class="bubble" cx="150" cy="0" r="2.2" style="animation-delay:.9s"/>
              <circle class="bubble" cx="188" cy="0" r="2.6" style="animation-delay:1.8s"/>
              <circle class="bubble" cx="212" cy="0" r="2" style="animation-delay:2.6s"/>
              <circle class="bubble" cx="130" cy="0" r="2.4" style="animation-delay:3.4s"/>
            </g>

            <!-- contorno do copo principal -->
            <path d="M66,120 C60,235 62,340 96,428 Q104,440 116,440 L204,440 Q216,440 224,428 C258,340 260,235 254,120 " fill="none" stroke="var(--forest)" stroke-width="4"/>

            <!-- boca do copo (rim) -->
            <ellipse cx="160" cy="120" rx="94" ry="13" fill="none" stroke="var(--forest)" stroke-width="4"/>

            <ellipse cx="160" cy="122" rx="82" ry="9" fill="none" stroke="var(--forest)" stroke-width="1.4" opacity="0.45"/>

            <!-- pe do copo -->
            <ellipse cx="160" cy="434" rx="56" ry="7" fill="none" stroke="var(--forest)" stroke-width="1.6" opacity="0.35"/>

            <!-- brilho do vidro -->
            <path d="M96,168 C88,258 88,348 104,410" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="9" stroke-linecap="round"/>
            <!-- logo real da marca, colada no copo -->
            <image href="imagens/logo.png" xlink:href="imagens/logo.png" x="86" y="238" width="148" height="66" preserveAspectRatio="xMidYMid meet" opacity="0.95"/>
          </svg>
